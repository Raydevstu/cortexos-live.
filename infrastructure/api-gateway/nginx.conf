# CortexOS Single API Gateway (/api/v1/*) Scaffold
events {}
http {
  server {
    listen 8080;
    location /api/v1/brain { return 501; }
    location /api/v1/jarvis { return 501; }
    location /api/v1/librarian { return 501; }
    location /api/v1/providers { return 501; }
    location /api/v1/search { return 501; }
    location /api/v1/studios { return 501; }
    location /api/v1/workflows { return 501; }
  }
}

# CortexOS Local Development Topology (Sprint 1 Scaffold — Zero Runtime Logic)
services:
  postgres:
    image: pgvector/pgvector:pg15
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  neo4j:
    image: neo4j:5
    ports: ["7474:7474", "7687:7687"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
  minio:
    image: minio/minio:latest
    ports: ["9000:9000", "9001:9001"]
  temporal:
    image: temporalio/auto-setup:latest
    ports: ["7233:7233"]
    depends_on: [postgres]

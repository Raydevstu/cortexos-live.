[project]
name = "cortexos-brain-service"
version = "0.1.0"
description = "CortexOS System of Record service (FastAPI, SQLAlchemy 2.0, PostgreSQL, Alembic)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.13.3",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.5.0",
  "opentelemetry-api>=1.27.0",
  "cortexos-types",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "aiosqlite>=0.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "cortexos-jarvis-service"
version = "0.1.0"
description = "CortexOS Jarvis Runtime: OS Supervisor Engine, Phase Engine, Approval Gates, Risk Engine, WorkRequest Dispatcher, Agent Mesh Controller, Council Runtime, and Temporal Workflow Integration."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.5.0",
  "cortexos-types",
  "cortexos-workflows",
  "cortexos-studios",
  "cortexos-events",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

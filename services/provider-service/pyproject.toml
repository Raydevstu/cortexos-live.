[project]
name = "cortexos-provider-service"
version = "0.1.0"
description = "CortexOS Unified Multi-Provider Model Registry, Capability Router, Failover, Health & Cost Tracking Service."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.5.0",
  "opentelemetry-api>=1.27.0",
  "cortexos-types",
  "cortexos-providers",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

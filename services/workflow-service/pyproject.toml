[project]
name = "cortexos-workflow-service"
version = "0.1.0"
description = "CortexOS Temporal Workflow Runtime hosting all 16 lifecycle, phase, studio, council, approval, war-room, and provider workflows."
requires-python = ">=3.12"
dependencies = [
  "temporalio>=1.7.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.5.0",
  "cortexos-types",
  "cortexos-workflows",
  "cortexos-studios",
  "cortexos-events",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
